name: dev

# 手动触发的 dev 构建(Actions → dev → Run workflow)。
#
# 默认行为(auto):若仓库里带了 patches/000[1-9]-*.patch 与
# patches/0010-*.patch(bsd-broadcast-relay-TONYX9000 移植补丁 +
# 联机监视器 0010)且尚未应用,构建前先自动应用,
# 再产出可直接拷到 SD 卡的产物。
# 分支本身已打好补丁时会自动跳过(以 relay_client.cpp 为标记)。
#
# 用法一:把 .github/workflows/dev.yml 与 patches/ 一起放进仓库,
#        保持 master 干净,构建时打补丁;
# 用法二:只取 dev.yml,补丁提前应用后推送,构建原样分支。

on:
  workflow_dispatch:
    inputs:
      apply_patches:
        description: '构建前应用 patches/*.patch 移植补丁'
        type: choice
        options:
          - auto    # 有补丁且未应用时才应用(推荐)
          - 'yes'   # 强制应用
          - 'no'    # 不应用,按当前分支原样构建
        default: auto

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container:
      # devkitA64 r29.2 / gcc 15.2.0。gcc >= 16 会误编译 libstratosphere,
      # 症状为 LDN 会话结束时主机死机(顶层 Makefile 亦有告警)。
      image: devkitpro/devkita64:20260219

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          # git describe 需要标签与完整历史
          fetch-depth: 0

      - name: Trust the workspace for git
        run: git config --global --add safe.directory '*'

      - name: Toolchain versions
        continue-on-error: true
        run: |
          (dkp-pacman -Q 2>/dev/null || pacman -Q 2>/dev/null) \
            | grep -Ei 'devkita64|libnx|newlib|binutils' || true
          "${DEVKITPRO:-/opt/devkitpro}/devkitA64/bin/aarch64-none-elf-gcc" --version | head -1 || true
          git --version || true
          echo "version string this build will stamp:"
          echo "  $(git describe --tags 2>/dev/null)$(git diff --quiet --ignore-submodules=all HEAD 2>/dev/null || echo -dirty)"
          exit 0

      - name: Apply port patches (patches/*.patch)
        env:
          DECISION: ${{ inputs.apply_patches }}
        run: |
          shopt -s nullglob
          patches=(patches/000[1-9]-*.patch patches/0010-*.patch)

          if [ "$DECISION" = "no" ]; then
            echo "按输入跳过补丁。"
            exit 0
          fi

          if [ ${#patches[@]} -eq 0 ]; then
            if [ "$DECISION" = "yes" ]; then
              echo "::error::未找到 patches/000[1-9]-*.patch / patches/0010-*.patch"
              exit 1
            fi
            echo "patches/ 下没有补丁,跳过。"
            exit 0
          fi

          if [ -f ldn_mitm/source/relay_client.cpp ]; then
            if [ "$DECISION" = "yes" ]; then
              echo "::error::补丁似乎已应用(relay_client.cpp 已存在),但输入要求强制应用。"
              exit 1
            fi
            echo "检测到 ldn_mitm/source/relay_client.cpp,补丁已应用,跳过。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "应用 ${#patches[@]} 个补丁:"
          printf '  %s\n' "${patches[@]}"
          git am --3way "${patches[@]}"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: update Atmosphere-libs (适配最新系统)
        run: |
          # 与上游 nightly.yml 相同:构建前把 Atmosphere-libs 顶到 master,
          # 跟踪最新系统固件适配(23.0.1+);不顶的话插件会在新系统上启动报错。
          pushd Atmosphere-libs
          git fetch --all
          git reset --hard origin/master
          popd

      - name: Install libnx master (before building)
        run: |
          # 最新 Atmosphere-libs 使用 pgl 新命名(pglEventObserverGetShellEvent 系,
          # libnx 2026-09-15 a13cd192 起),安装 libnx master 与其配套,
          # 保证无论镜像自带 libnx 版本如何都能编译。
          pushd /tmp
          git clone https://github.com/switchbrew/libnx
          cd libnx
          make -j8 PREFIX="ccache aarch64-none-elf-"
          make install
          popd

      - name: Install switch-curl (订阅 HTTPS 下载)
        run: |
          set -euo pipefail
          # 订阅(chinese_db.json)经 https://v6.gh-proxy.org/ 加速镜像下载,
          # overlay 内置 switch-curl(libnx SSL 后端)走 TLS;确保镜像装了它。
          if dkp-pacman -Q switch-curl >/dev/null 2>&1; then
            echo "switch-curl already installed"
          else
            # DevkitPro package DB refresh can fail with HTTP 403. Do not
            # make a mirror refresh failure fatal if cached DBs can install it.
            if ! dkp-pacman -Sy --noconfirm; then
              echo "::warning::DevkitPro package DB refresh failed; trying cached metadata."
            fi
            dkp-pacman -S --noconfirm --needed switch-curl || true
          fi
          if ! dkp-pacman -Q switch-curl >/dev/null 2>&1; then
            echo "::error::Required package switch-curl is not installed."
            exit 1
          fi

      - name: Set release and plugin versions
        run: |
          echo "RELEASE_VERSION=dev" >> "$GITHUB_ENV"
          # Match TARGET_VERSION in ldn_mitm/Makefile and overlay/Makefile.
          plugin_version="$(git describe --tags)$(git diff --quiet --ignore-submodules=all HEAD 2>/dev/null || echo -dirty)"
          clean_version="${plugin_version%-dirty}"
          if [[ "$clean_version" =~ -g([0-9a-fA-F]+)$ ]]; then
            # Keep only git-describe's final g<short-sha> part, e.g. gf0597ab.
            archive_suffix="g${BASH_REMATCH[1]}"
          else
            # At an exact tag, use the same short-commit style as the suffix.
            archive_suffix="g$(git rev-parse --short=7 HEAD)"
          fi
          echo "PLUGIN_VERSION=$plugin_version" >> "$GITHUB_ENV"
          echo "ARCHIVE_SUFFIX=$archive_suffix" >> "$GITHUB_ENV"
          echo "Online plugin version: $plugin_version"
          echo "Release archive suffix: $archive_suffix"

      - name: Build
        id: build
        run: make -j8 PREFIX="ccache aarch64-none-elf-"

      - name: Upload sdcard
        uses: actions/upload-artifact@v7
        with:
          name: sdcard
          path: out/sd
          # switch/.overlays 是隐藏目录,不加这项 overlay 不会进产物
          include-hidden-files: true

      - name: Upload ldn_mitm elf file
        uses: actions/upload-artifact@v7
        with:
          name: ldn_mitm.elf
          path: ldn_mitm/ldn_mitm.elf

      - name: Upload overlay elf file
        uses: actions/upload-artifact@v7
        with:
          name: overlay.elf
          path: overlay/overlay.elf

      - name: Pack
        run: |
          # Match release.yml: publish the installable Atmosphere + Switch archive.
          apt-get update && apt-get install -y zip
          cd ./out/sd
          zip -r "./ldn_mitm-${ARCHIVE_SUFFIX}.zip" atmosphere switch

      - name: Remove previous plugin ZIP assets from dev Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: "dev",
              }));
            } catch (error) {
              if (error.status === 404) {
                core.info("No previous dev release; skipping asset cleanup.");
                return;
              }
              throw error;
            }

            const staleAssets = release.assets.filter(({ name }) =>
              /^ldn_mitm[-_].*[.]zip$/i.test(name)
            );
            for (const asset of staleAssets) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
              });
              core.info(`Deleted stale asset ${asset.name} (${asset.id}).`);
            }

      # Follow LanPlayMonitor/release.yml: create/update the Release via the API;
      # avoid git-pushing the tag with GITHUB_TOKEN when the workflow file changed.
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_VERSION }}
          tag_name: dev
          target_commitish: ${{ github.sha }}
          files: out/sd/ldn_mitm-${{ env.ARCHIVE_SUFFIX }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
