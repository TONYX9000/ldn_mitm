name: dev

on:
  workflow_dispatch:
    inputs:
      apply_patches:
        description: '构建前应用 patches/*.patch 移植补丁'
        type: choice
        options:
          - auto
          - 'yes'
          - 'no'
        default: auto

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: devkitpro/devkita64:20260219
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Trust workspace for git
        run: git config --global --add safe.directory '*'

      - name: Apply port patches
        env:
          DECISION: ${{ inputs.apply_patches }}
        run: |
          shopt -s nullglob
          patches=(patches/000[1-9]-*.patch patches/0010-*.patch)
          [[ "$DECISION" == no ]] && exit 0
          if (( ${#patches[@]} == 0 )); then
            [[ "$DECISION" == yes ]] && { echo "::error::No port patches found"; exit 1; }
            echo "No patches found; skipping."
            exit 0
          fi
          if [[ -f ldn_mitm/source/relay_client.cpp ]]; then
            [[ "$DECISION" == yes ]] && { echo "::error::Patches already applied"; exit 1; }
            echo "Patches already applied; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am --3way "${patches[@]}"

      - uses: hendrikmuhs/ccache-action@v1.2

      - name: Update Atmosphere-libs
        run: |
          git -C Atmosphere-libs fetch --all
          git -C Atmosphere-libs reset --hard origin/master

      - name: Install libnx master
        run: |
          git clone https://github.com/switchbrew/libnx /tmp/libnx
          make -C /tmp/libnx -j8 PREFIX="ccache aarch64-none-elf-"
          make -C /tmp/libnx install

      - name: Install switch-curl (订阅 HTTPS 下载)
        run: |
          # 订阅(chinese_db.json)经 https://v6.gh-proxy.org/ 加速镜像下载,
          # overlay 内置 switch-curl(libnx SSL 后端)走 TLS;确保镜像装了它。
          dkp-pacman -Sy --noconfirm switch-curl

      - name: Set plugin version
        run: |
          version_base="$(git describe --tags --exclude=dev 2>/dev/null || true)"
          if [[ -z "$version_base" ]]; then
            version_base="g$(git rev-parse --short=7 HEAD)"
          fi
          plugin_version="$version_base"
          if ! git diff --quiet --ignore-submodules=all HEAD 2>/dev/null; then
            plugin_version+="-dirty"
          fi
          if [[ "$plugin_version" =~ -g([[:xdigit:]]+)(-dirty)?$ ]]; then
            archive_suffix="g${BASH_REMATCH[1]}"
          elif [[ "$plugin_version" =~ ^g([[:xdigit:]]+)(-dirty)?$ ]]; then
            archive_suffix="g${BASH_REMATCH[1]}"
          else
            archive_suffix="g$(git rev-parse --short=7 HEAD)"
          fi
          echo "PLUGIN_VERSION=$plugin_version" >> "$GITHUB_ENV"
          echo "ARCHIVE_SUFFIX=$archive_suffix" >> "$GITHUB_ENV"
          echo "Plugin version: $plugin_version; archive suffix: $archive_suffix"

      - name: Build
        # Pass the release version to recursive Makefiles so the overlay doesn't embed the moving dev tag.
        run: make -j8 PREFIX="ccache aarch64-none-elf-" TARGET_VERSION="$PLUGIN_VERSION"

      - name: Upload sdcard
        uses: actions/upload-artifact@v7
        with:
          name: sdcard
          path: out/sd
          include-hidden-files: true

      - name: Upload ldn_mitm ELF
        uses: actions/upload-artifact@v7
        with:
          name: ldn_mitm.elf
          path: ldn_mitm/ldn_mitm.elf

      - name: Upload overlay ELF
        uses: actions/upload-artifact@v7
        with:
          name: overlay.elf
          path: overlay/overlay.elf

      - name: Pack release ZIP
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            apt-get update && apt-get install -y zip
          fi
          cd out/sd
          zip -r "ldn_mitm-${ARCHIVE_SUFFIX}.zip" atmosphere switch config

      - name: Remove old dev ZIP assets
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: "dev",
              });
              for (const asset of release.assets.filter(({ name }) =>
                /^ldn_mitm[-_].*[.]zip$/i.test(name)
              )) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
                core.info(`Deleted ${asset.name}`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info("No existing dev release; skipping cleanup.");
            }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: dev
          tag_name: dev
          target_commitish: ${{ github.sha }}
          files: out/sd/ldn_mitm-${{ env.ARCHIVE_SUFFIX }}.zip
          body: |
            自动滚动 dev 预发布。
            联机插件版本：`${{ env.PLUGIN_VERSION }}`
            构建记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          append_body: false
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
