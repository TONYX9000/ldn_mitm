name: beta

# 手动触发的 beta 构建(Actions → beta → Run workflow)。
#
# 默认行为(auto):若仓库里带了 patches/000[1-9]-*.patch 与
# patches/0010-*.patch(bsd-broadcast-relay-TONYX9000 移植补丁 +
# 联机监视器 0010)且尚未应用,构建前先自动应用,
# 再产出可直接拷到 SD 卡的产物。
# 分支本身已打好补丁时会自动跳过(检查多个补丁应用标记)。
#
# 用法一:把 .github/workflows/beta.yml 与 patches/ 一起放进仓库,
#        保持 master 干净,构建时打补丁;
# 用法二:只取 beta.yml,补丁提前应用后推送,构建原样分支。

on:
  workflow_dispatch:
    inputs:
      apply_patches:
        description: '构建前应用 patches/*.patch 移植补丁'
        type: choice
        options:
          - auto    # 有补丁且未应用时才应用(推荐)
          - 'yes'   # 强制应用
          - 'no'    # 不应用,按当前分支原样构建
        default: auto

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      # devkitA64 r29.2 / gcc 15.2.0。gcc >= 16 会误编译 libstratosphere,
      # 症状为 LDN 会话结束时主机死机(顶层 Makefile 亦有告警)。
      image: devkitpro/devkita64:20260219

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          # git describe 需要标签与完整历史
          fetch-depth: 0

      - name: Trust the workspace for git
        run: git config --global --add safe.directory '*'

      - name: Toolchain versions
        id: beta_version
        continue-on-error: true
        run: |
          (dkp-pacman -Q 2>/dev/null || pacman -Q 2>/dev/null) \
            | grep -Ei 'devkita64|libnx|newlib|binutils' || true
          "${DEVKITPRO:-/opt/devkitpro}/devkitA64/bin/aarch64-none-elf-gcc" --version | head -1 || true
          git --version || true
          short_sha="${GITHUB_SHA:0:7}"
          version="beta-g${short_sha}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Beta plugin version: ${version}"
          exit 0

      - name: Apply port patches (patches/*.patch)
        env:
          DECISION: ${{ inputs.apply_patches }}
        run: |
          shopt -s nullglob
          patches=(patches/000[1-9]-*.patch patches/0010-*.patch)

          if [ "$DECISION" = "no" ]; then
            echo "按输入跳过补丁。"
            exit 0
          fi

          if [ ${#patches[@]} -eq 0 ]; then
            if [ "$DECISION" = "yes" ]; then
              echo "::error::未找到 patches/000[1-9]-*.patch / patches/0010-*.patch"
              exit 1
            fi
            echo "patches/ 下没有补丁,跳过。"
            exit 0
          fi

          # 检查多个补丁应用标记: 0001(relay_client.cpp) + 0008(ServerRow) + 0010(Makefile INCLUDES)
          PATCHES_APPLIED=0
          [ -f ldn_mitm/source/relay_client.cpp ] && PATCHES_APPLIED=$((PATCHES_APPLIED + 1))
          [ -f overlay/source/monitor.cpp ] && grep -q 'ServerRow' overlay/source/monitor.cpp && PATCHES_APPLIED=$((PATCHES_APPLIED + 1))
          [ -f overlay/Makefile ] && grep -q 'INCLUDES.*source' overlay/Makefile && PATCHES_APPLIED=$((PATCHES_APPLIED + 1))

          if [ "$DECISION" = "yes" ]; then
            if [ $PATCHES_APPLIED -ge 3 ]; then
              echo "::error::补丁似乎已应用,但输入要求强制应用。"
              exit 1
            fi
          else
            # auto 模式: 3 个标记都存在才认为已应用
            if [ $PATCHES_APPLIED -ge 3 ]; then
              echo "检测到所有补丁已应用,跳过。"
              exit 0
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "应用 ${#patches[@]} 个补丁:"
          printf '  %s\n' "${patches[@]}"
          git am --3way "${patches[@]}"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: update Atmosphere-libs (适配最新系统)
        run: |
          # 与上游 nightly.yml 相同:构建前把 Atmosphere-libs 顶到 master,
          # 跟踪最新系统固件适配(23.0.1+);不顶的话插件会在新系统上启动报错。
          pushd Atmosphere-libs
          git fetch --all
          git reset --hard origin/master
          popd

      - name: Install libnx master (before building)
        run: |
          # 最新 Atmosphere-libs 使用 pgl 新命名(pglEventObserverGetShellEvent 系,
          # libnx 2026-09-15 a13cd192 起),安装 libnx master 与其配套,
          # 保证无论镜像自带 libnx 版本如何都能编译。
          pushd /tmp
          git clone https://github.com/switchbrew/libnx
          cd libnx
          make -j8 PREFIX="ccache aarch64-none-elf-"
          make install
          popd

      - name: Install switch-curl (订阅 HTTPS 下载)
        run: |
          set -euo pipefail
          # 订阅(chinese_db.json)经 https://v6.gh-proxy.org/ 加速镜像下载,
          # overlay 内置 switch-curl(libnx SSL 后端)走 TLS;确保镜像装了它。
          if dkp-pacman -Q switch-curl >/dev/null 2>&1; then
            echo "switch-curl already installed"
          else
            # DevkitPro package DB refresh can fail with HTTP 403. Do not
            # make a mirror refresh failure fatal if cached DBs can install it.
            if ! dkp-pacman -Sy --noconfirm; then
              echo "::warning::DevkitPro package DB refresh failed; trying cached metadata."
            fi
            dkp-pacman -S --noconfirm --needed switch-curl || true
          fi
          if ! dkp-pacman -Q switch-curl >/dev/null 2>&1; then
            echo "::error::Required package switch-curl is not installed."
            exit 1
          fi

      - name: Build
        id: build
        env:
          TARGET_VERSION: ${{ steps.beta_version.outputs.version }}
        run: make -j8 PREFIX="ccache aarch64-none-elf-" TARGET_VERSION="$TARGET_VERSION"

      - name: Upload sdcard
        uses: actions/upload-artifact@v7
        with:
          name: sdcard
          path: out/sd
          # switch/.overlays 是隐藏目录,不加这项 overlay 不会进产物
          include-hidden-files: true

      - name: Upload ldn_mitm elf file
        uses: actions/upload-artifact@v7
        with:
          name: ldn_mitm.elf
          path: ldn_mitm/ldn_mitm.elf

      - name: Upload overlay elf file
        uses: actions/upload-artifact@v7
        with:
          name: overlay.elf
          path: overlay/overlay.elf
