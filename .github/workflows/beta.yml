name: beta

# 手动触发的 beta 构建(Actions → beta → Run workflow)。
#
# 默认行为(auto):若仓库里带了 patches/000[1-9]-*.patch
# (bsd-broadcast-relay-TONYX9000 移植补丁)且尚未应用,
# 构建前先自动应用,再产出可直接拷到 SD 卡的产物。
# 分支本身已打好补丁时会自动跳过(以 relay_client.cpp 为标记)。
#
# 用法一:把 .github/workflows/beta.yml 与 patches/ 一起放进仓库,
#        保持 master 干净,构建时打补丁;
# 用法二:只取 beta.yml,补丁提前应用后推送,构建原样分支。

on:
  workflow_dispatch:
    inputs:
      apply_patches:
        description: '构建前应用 patches/*.patch 移植补丁'
        type: choice
        options:
          - auto    # 有补丁且未应用时才应用(推荐)
          - 'yes'   # 强制应用
          - 'no'    # 不应用,按当前分支原样构建
        default: auto

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      # devkitA64 r29.2 / gcc 15.2.0。gcc >= 16 会误编译 libstratosphere,
      # 症状为 LDN 会话结束时主机死机(顶层 Makefile 亦有告警)。
      image: devkitpro/devkita64:20260219

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          # git describe 需要标签与完整历史
          fetch-depth: 0

      - name: Trust the workspace for git
        run: git config --global --add safe.directory '*'

      - name: Toolchain versions
        continue-on-error: true
        run: |
          (dkp-pacman -Q 2>/dev/null || pacman -Q 2>/dev/null) \
            | grep -Ei 'devkita64|libnx|newlib|binutils' || true
          "${DEVKITPRO:-/opt/devkitpro}/devkitA64/bin/aarch64-none-elf-gcc" --version | head -1 || true
          git --version || true
          echo "version string this build will stamp:"
          echo "  $(git describe --tags 2>/dev/null)$(git diff --quiet --ignore-submodules=all HEAD 2>/dev/null || echo -dirty)"
          exit 0

      - name: Apply port patches (patches/*.patch)
        env:
          DECISION: ${{ inputs.apply_patches }}
        run: |
          shopt -s nullglob
          patches=(patches/000[1-9]-*.patch)

          if [ "$DECISION" = "no" ]; then
            echo "按输入跳过补丁。"
            exit 0
          fi

          if [ ${#patches[@]} -eq 0 ]; then
            if [ "$DECISION" = "yes" ]; then
              echo "::error::未找到 patches/000[1-9]-*.patch"
              exit 1
            fi
            echo "patches/ 下没有补丁,跳过。"
            exit 0
          fi

          if [ -f ldn_mitm/source/relay_client.cpp ]; then
            if [ "$DECISION" = "yes" ]; then
              echo "::error::补丁似乎已应用(relay_client.cpp 已存在),但输入要求强制应用。"
              exit 1
            fi
            echo "检测到 ldn_mitm/source/relay_client.cpp,补丁已应用,跳过。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "应用 ${#patches[@]} 个补丁:"
          printf '  %s\n' "${patches[@]}"
          git am --3way "${patches[@]}"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Build
        id: build
        run: make -j8 PREFIX="ccache aarch64-none-elf-"
        continue-on-error: true

      - name: Install libnx master & Retry build
        id: retry
        if: ${{ steps.build.outcome == 'failure' }}
        run: |
          pushd /tmp
          git clone https://github.com/switchbrew/libnx
          cd libnx
          make -j8 PREFIX="ccache aarch64-none-elf-"
          make install
          popd
          make -j8 PREFIX="ccache aarch64-none-elf-"

      - name: Upload sdcard
        uses: actions/upload-artifact@v7
        with:
          name: sdcard
          path: out/sd
          # switch/.overlays 是隐藏目录,不加这项 overlay 不会进产物
          include-hidden-files: true

      - name: Upload ldn_mitm elf file
        uses: actions/upload-artifact@v7
        with:
          name: ldn_mitm.elf
          path: ldn_mitm/ldn_mitm.elf

      - name: Upload overlay elf file
        uses: actions/upload-artifact@v7
        with:
          name: overlay.elf
          path: overlay/overlay.elf
