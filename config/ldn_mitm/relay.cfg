# ============================================================
#  联机中继服务器列表  （8 台）
# ------------------------------------------------------------
#  格式： <名称> <主机:端口>
#     · 名称必须【纯英文】—— 插件字体没有中文字形，中文会显示成方块
#     · 名称不能带空格（空格是名称和地址的分隔符）
#     · 最多 8 台，超出的会被忽略
#     · # 开头的行是注释，不读取
#     · 两台机器必须选同一台服务器
# ------------------------------------------------------------
#  【关于延迟显示】—— 2026-10-18 查明
#  延迟靠服务器回显 PING 包。以前只有 China-Beijing 能显示，
#  不是那些服务器"不回显"，而是【PING 包的 payload 长度不对】：
#
#    服务器 1.0.x（olunira.fun）：只回显 msg[0..4]，不检查长度
#    服务器 2.0.x/3.0.x（Rust）：严格检查 payload 必须正好 4 字节，
#                                3 字节的包会被当作损坏直接丢弃
#
#  旧版插件发的是 {02 6c 64 6e}（payload 3 字节），
#  所以只有 1.0 的北京能回，2.0/3.0 全部静默丢弃。
#
#  2026-10-18 已修复：改成 {02 6c 64 6e 70}（payload 4 字节）。
#  1.0 会截前 4 字节回显，2.0/3.0 原样回 5 字节，两边都认。
#  修复后 8 台服务器（理论）全部能显示延迟。
#
#  实测（2026-10-18）：
#    名称              版本                   PING
#    China-Beijing     1.0.0-alpha.2          ✅ 40-100ms
#    China-Shanghai    3.0.0                  ✅ 33ms   ← 新增
#    China-Guangdong   2.0.0-rust.alpha.11    ✅（修复后）
#    China-Zhejiang    2.0.0-rust.alpha.11    ✅（修复后）
#    China-Henan       2.0.0-rust.alpha.11    ✅（修复后）
#    USA-SanFrancisco  2.0.0-rust.alpha.11    ✅（修复后）
#    Netherlands-1     2.0.0-rust.alpha.11    ✅（修复后）
#    Germany-1         3.0.0                  ✅（修复后）
#
#  查服务器版本：浏览器打开 http://<地址>/info
# ------------------------------------------------------------
#  【重要】关于 id=（本机虚拟地址 10.13.x.x）
#     · 这里故意【不写】id=
#     · 插件第一次连上中继时会自动分配一个唯一的 id，
#       并自动写回本文件（之后就一直沿用它）
